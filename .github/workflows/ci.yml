# CI for the Hal monorepo (REQ-SYS-21): lint, the ASCII gate and the hermetic tests on Python
# 3.11 to 3.13. Tests marked gpu, docker, network, slow, bwrap, systemd or live are deselected
# by the pytest configuration in pyproject.toml, so no job here needs a GPU or a model.
name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and ASCII gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install the workspace
        run: uv sync --all-packages --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check packages tests
      - name: ASCII gate
        run: scripts/check-ascii.sh

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the workspace
        run: uv sync --all-packages --frozen
      - name: Run the hermetic tests
        run: uv run pytest -q

  windows:
    name: hal-remote on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # Only hal-kit and hal-remote are installed: the laptop client has no other package
      # (07-remote, Windows CI job). Tests that need POSIX features skip with a reason.
      - name: Run the hal-remote tests
        run: uv run --frozen --package hal-remote --group dev pytest -q packages/hal-remote

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, equal to the value in the release's
      # gitleaks_8.30.1_checksums.txt (checked 2026-10-29)
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not only the tip
      - name: Install gitleaks from a pinned, checksummed release
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
