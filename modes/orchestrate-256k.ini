; Mode orchestrate-256k: mode orchestrate with the 177B's full 256K context.
; hal-route.py (policy swap) sends the main conversation to hal-hybrid without shell or edit
; tools, and every subagent to hal-agent. When the other model is needed it saves
; hal-hybrid's KV cache to @STATE@/slots, unloads one model and loads the other: about 17s to
; the 27B and 50s back, including restoring a 29K-token cache in 3s.
; Both models think at medium; as in hybrid-auto, hal-route.py adds an xhigh note at a
; turn's decision points, such as a user message, a subagent report or a failing command.
; Rendered by hal-serve, which replaces @MODELS@, @HAL@ and @STATE@.
version = 1

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
parallel = 2
kv-unified = true
load-on-startup = true
slot-save-path = @STATE@/slots

; Tuned for a headless GPU, as in hybrid-auto.ini. With a desktop on the GPU, raise
; fit-target to 1024 in both models. The extra 128K of KV cache takes VRAM that
; otherwise holds experts.
[hal-hybrid]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
chat-template-kwargs = {"reasoning_effort":"medium"}
model = @MODELS@/qwen3.8-flash-next/IQ3_XXS/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS-00001-of-00002.gguf
model-draft = @MODELS@/qwen3.8-flash-next/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
spec-type = draft-mtp
n-gpu-layers-draft = 99
threads = 8
batch-size = 4096
ubatch-size = 2048
ctx-size = 262144
fit-target = 0
load-mode = none

; 112K is the most that fits beside the MTP head (128K is 720MB short); peak 23.7GB on a
; 31K prefill. Subagents start from a fresh context, so they rarely get near it.
[hal-agent]
load-on-startup = false
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
chat-template-kwargs = {"reasoning_effort":"medium"}
model = @MODELS@/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
model-draft = @MODELS@/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
n-gpu-layers = 99
n-gpu-layers-draft = 99
ctx-size = 114688
fit-target = 256
