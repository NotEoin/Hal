# hal-hub's own tools. Every module declares its tools in a file like this one.
[module]
name = "hub"
summary = "Find and run the tools of every installed Hal module"
python = "halhub.tools"

[[tools]]
name = "hal_find_tools"
function = "find_tools"
description = "Search all of Hal's tools for ones that can do what the user asked. Use this whenever no listed tool fits; there are tools for calendar, tasks, memory, system, files, desktop, media, lights, web, mail, jobs, timers, network, power and more."
[tools.params.query]
type = "string"
description = "what you want to do, in plain words"
required = true
[tools.params.limit]
type = "integer"
description = "most tools to return"

[[tools]]
name = "hal_modules"
function = "modules"
description = "List the installed Hal modules and the tools each one provides."
