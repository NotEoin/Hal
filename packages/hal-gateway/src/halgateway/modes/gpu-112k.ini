; Mode gpu-112k: mode gpu with 112K of context, for a headless GPU.
; Rendered by hal-serve, which replaces @MODELS@ with HAL_MODELS_DIR and @HAL@ with this repo.
version = 1

[hal]
description = mode gpu with 112K of context, for a headless GPU
main = hal-gpu
agent = hal-gpu

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
; Two slots, so Claude Code's small side requests don't evict the main prompt cache
parallel = 2
kv-unified = true
load-on-startup = true

; Qwen3.8-27B UD-Q4_K_XL scores within noise of Q5_K_XL and Q6_K on code perplexity,
; and leaves room for the MTP head, which doubles decode speed (about 40 to 80 tokens/s)
[hal-gpu]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
model = @MODELS@/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
model-draft = @MODELS@/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
n-gpu-layers = 99
n-gpu-layers-draft = 99
ctx-size = 114688
; With all 24GB free (no desktop on the GPU), a fit margin of 256MB holds 112K of context
; beside the MTP head: peak 23.7GB on a 31K prefill, 1,140 tokens/s prefill and about 70
; tokens/s decode. 128K is 720MB short. With a desktop on the GPU, use mode gpu.
fit-target = 256
