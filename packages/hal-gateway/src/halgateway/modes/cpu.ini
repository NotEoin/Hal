; Mode cpu: a large mixture-of-experts coder with every weight in system RAM.
; Rendered by hal-serve, which replaces @MODELS@ with HAL_MODELS_DIR and @HAL@ with this repo.
version = 1

[hal]
description = a large mixture-of-experts coder with every weight in system RAM
main = hal-cpu
agent = hal-cpu

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 2
kv-unified = true
load-on-startup = true

; Qwen3.8-Flash-Next-Coder (177B, 10 of 512 experts active) at ISTA's GSQ-RCO IQ1_M is
; 54GiB. Decode is bound by memory bandwidth: its 5.7 tokens/s beats the 5.0 of the smaller
; Laguna-S-2.1 at UD-IQ3_S (45GiB), because fewer bytes of experts are read per token.
; With a GPU present, batches of 2048 tokens are copied to it for prompt processing,
; which lifts prefill from about 45 to 416 tokens/s while the weights stay in RAM.
[hal-cpu]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
model = @MODELS@/qwen3.8-flash-next-coder/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
n-gpu-layers = 0
threads = 8
batch-size = 4096
ubatch-size = 2048
ctx-size = 131072
