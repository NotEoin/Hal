; Mode hybrid-auto-256k: mode hybrid-auto with the model's full 256K context.
; hal-route.py (policy effort) adds an xhigh note to the end of the prompt when a request
; follows a user message, a subagent report or a failing tool result. The note sits after
; the cached prefix, so changing it from one request to the next costs a few tokens of
; prompt processing instead of the whole conversation.
; Rendered by hal-serve, which replaces @MODELS@ with HAL_MODELS_DIR and @HAL@ with this repo.
version = 1

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
parallel = 2
kv-unified = true
load-on-startup = true

; Tuned for a headless GPU, where all 24GB is free: a fit margin of 0 moves one more expert
; tensor into VRAM (peak 23.3GB on a 28K prefill), and loading without mmap avoids paging
; experts back in from disk. Together they lifted prefill from 375 to 509 tokens/s and decode
; from 21.7 to 24.2 at 28K deep (measured at 128K). The extra 128K of KV cache takes VRAM
; that otherwise holds experts: at 256K decode is 17 to 19 tokens/s and prefill 470 at 28K.
; With a desktop on the GPU, raise fit-target to 1024.
[hal-hybrid]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
chat-template-kwargs = {"reasoning_effort":"medium"}
model = @MODELS@/qwen3.8-flash-next/IQ3_XXS/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS-00001-of-00002.gguf
model-draft = @MODELS@/qwen3.8-flash-next/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
spec-type = draft-mtp
n-gpu-layers-draft = 99
threads = 8
batch-size = 4096
ubatch-size = 2048
ctx-size = 262144
fit-target = 0
load-mode = none
