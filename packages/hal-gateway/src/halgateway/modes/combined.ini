; Mode combined: the cpu model orchestrates and reasons, the gpu model runs every subagent.
; hal-route.py asks hal-router which of the two should take each new turn.
; Rendered by hal-serve, which replaces @MODELS@ with HAL_MODELS_DIR and @HAL@ with this repo.
version = 1

[hal]
description = the cpu model orchestrates and reasons, the gpu model runs every subagent
main = hal-orchestrator
agent = hal-agent
classifier = hal-router
route = true
delegate-note = @MODES@/combined-prompt.txt

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
parallel = 2
kv-unified = true
load-on-startup = true

; The orchestrator's prompt processing borrows VRAM for its batches: 2.8GB at a ubatch of
; 2048, 1.9GB at 1024. The agent gets one slot and 64K of context so that 1.9GB stays free.
[hal-agent]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
model = @MODELS@/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
model-draft = @MODELS@/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
n-gpu-layers = 99
n-gpu-layers-draft = 99
ctx-size = 65536
parallel = 1

[hal-orchestrator]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
model = @MODELS@/qwen3.8-flash-next-coder/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
n-gpu-layers = 0
threads = 8
batch-size = 4096
ubatch-size = 1024
ctx-size = 131072

; Kev-0.8B routed 12 of 12 hand-labelled coding requests correctly in about 0.4s on the
; CPU; Laya (0.4B) sent every request to the strong model, and Kev-4B took 2s
[hal-router]
model = @MODELS@/kev-0.8b/Kev-0.8B-Q8_0.gguf
n-gpu-layers = 0
device = none
threads = 4
ctx-size = 4096
parallel = 1
