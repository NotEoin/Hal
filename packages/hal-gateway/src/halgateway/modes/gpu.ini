; Mode gpu: one dense coder entirely in VRAM. The fastest mode.
; Rendered by hal-serve, which replaces @MODELS@ with HAL_MODELS_DIR and @HAL@ with this repo.
version = 1

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
; Two slots, so Claude Code's small side requests don't evict the main prompt cache
parallel = 2
kv-unified = true
load-on-startup = true

; Qwen3.8-27B UD-Q4_K_XL scores within noise of Q5_K_XL and Q6_K on code perplexity,
; and leaves room for the MTP head, which doubles decode speed (about 40 to 80 tokens/s)
[hal-gpu]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
model = @MODELS@/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
model-draft = @MODELS@/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
n-gpu-layers = 99
n-gpu-layers-draft = 99
ctx-size = 98304
