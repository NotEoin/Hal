; Mode hybrid: the largest model, split across VRAM and system RAM.
; Rendered by hal-serve, which replaces @MODELS@ with HAL_MODELS_DIR and @HAL@ with this repo.
version = 1

[hal]
description = the largest model, split across VRAM and system RAM
main = hal-hybrid
agent = hal-hybrid

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
parallel = 2
kv-unified = true
load-on-startup = true

; Qwen3.8-Flash-Next (177B, 10 of 512 experts active) at ISTA's GSQ-RCO IQ3_XXS is 71GiB.
; No layer counts are set, so llama.cpp's fit keeps attention and as many experts as fit
; in VRAM and the rest in RAM. The MTP draft lifts decode from about 20 to 25 tokens/s.
[hal-hybrid]
chat-template-file = @HAL@/modes/qwen3.8-chat.jinja
model = @MODELS@/qwen3.8-flash-next/IQ3_XXS/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS-00001-of-00002.gguf
model-draft = @MODELS@/qwen3.8-flash-next/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
spec-type = draft-mtp
n-gpu-layers-draft = 99
threads = 8
batch-size = 4096
ubatch-size = 2048
ctx-size = 131072
