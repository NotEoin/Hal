# Shipped model-profile catalogue (schema 1); see docs/design/03-agent.md section 3.4.
# Seeded from `ollama list` and `/api/show` on 2026-10-23. Sampling values are the vendor
# values Ollama publishes; context stays 32k because VRAM, not the model, limits a 24 GB card.
schema = 1

[defaults]
context = 32768
max_output = 8192
temperature = 0.6
top_p = 0.95
thinking = "on"
reasoning_replay = "tool_turns"
tool_format = "native"
leak_parsers = ["hermes", "json", "name_json"]
parallel_tool_calls = false
first_token_timeout_s = 600
system_role = "system"
max_tools_hint = 16
cache_prompt = true  # llama.cpp reuses the KV cache of the unchanged prompt prefix

[[model]]
match = ["gemma4:*", "gemma-4-*"]
family = "gemma4"
temperature = 1.0
top_k = 64
top_p = 0.95
leak_parsers = ["gemma4", "json", "name_json"]
evidence = "assistant eval 2026-10-10: 12b-it-qat 33/38, 26b-a4b 32/38 (single runs, think off)"

[[model]]
match = ["qwen3.5:*", "qwen3.6:*", "qwen3.8:*", "*qwen3.8*", "*qwen3.5*"]
family = "qwen35"
temperature = 1.0
top_k = 20
top_p = 0.95
presence_penalty = 1.5
leak_parsers = ["hermes", "qwen_xml", "json"]
evidence = "9b 33/38, 4b 31/38 (2026-10-10, single runs)"

[[model]]
match = ["qwen2.5-coder*", "qwen2.5-coder-*"]
family = "qwen25coder"
temperature = 0.7
top_p = 0.8
top_k = 20
repeat_penalty = 1.05
thinking = "off"
leak_parsers = ["hermes", "json", "name_json"]
notes = "sampling values from the Qwen2.5-Coder model card"

[[model]]
match = ["qwen3-coder*"]
family = "qwen3coder"
temperature = 0.7
thinking = "off"
leak_parsers = ["qwen_xml", "hermes"]
notes = "temperature is unverified: Ollama publishes none"

[[model]]
match = ["gpt-oss:*", "gpt-oss-*"]
family = "gptoss"
temperature = 1.0
thinking = "medium"
leak_parsers = ["harmony", "json"]

[[model]]
match = ["devstral*"]
family = "devstral"
temperature = 0.15
thinking = "off"
leak_parsers = ["mistral", "json"]
notes = "Devstral is tuned for agent loops; Mistral publishes 0.15 for it"

[[model]]
match = ["ministral-3:*", "mistral-small3.2:*", "magistral:*"]
family = "mistral3"
temperature = 0.15
thinking = "off"
leak_parsers = ["mistral", "json"]
evidence = "ministral-3:14b 28/38, mistral-small3.2:24b 30/38 (2026-10-10)"

[[model]]
match = ["glm-4.5*", "glm-4.6*", "glm-4.7*", "glm-4-*"]
family = "glm47"
temperature = 0.6
thinking = "on"
leak_parsers = ["glm", "hermes"]

[[model]]
match = ["deepseek-r1*", "deepseek-v3*", "deepseek-coder*"]
family = "deepseek"
temperature = 0.6
top_p = 0.95
thinking = "on"
reasoning_replay = "none"
leak_parsers = ["hermes", "json", "name_json"]
notes = "R1 style models: reasoning is not replayed (the vendor advises against it)"

[[model]]
match = ["llama3.1*", "llama3.3*", "llama-3.1*", "llama-3.3*"]
family = "llama3"
temperature = 0.6
top_p = 0.9
thinking = "off"
leak_parsers = ["json", "name_json", "hermes"]

[[model]]
match = ["granite4*"]
family = "granite"
thinking = "off"
leak_parsers = ["hermes", "json"]

[[model]]
match = ["phi4-mini*", "llama3.2*"]
family = "small"
thinking = "off"
context = 8192
leak_parsers = ["json", "name_json"]
