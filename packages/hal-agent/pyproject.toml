[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hal-agent"
dynamic = ["version"]
description = "The Hal agent: providers, loop, tool-call repair, toolsets, sessions and the ACP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["hal-kit"]

[tool.uv.sources]
hal-kit = { workspace = true }

[project.scripts]
hal-agent = "halagent.cli:main"

[tool.hatch.version]
path = "src/halagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/halagent"]
