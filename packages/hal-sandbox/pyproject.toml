[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hal-sandbox"
dynamic = ["version"]
description = "Hal sandbox: broker, container backends, images, hal box and checkpoints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["hal-kit", "hal-hub"]

[tool.uv.sources]
hal-kit = { workspace = true }
hal-hub = { workspace = true }

[tool.hatch.version]
path = "src/halsandbox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/halsandbox"]
