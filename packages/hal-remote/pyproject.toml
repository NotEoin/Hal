[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hal-remote"
dynamic = ["version"]
description = "Hal remote: optional SSH add-on for Linux and Windows clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["hal-kit"]

[dependency-groups]
# the Windows CI job installs only hal-kit and hal-remote, and uv takes `--group` from the package
dev = ["pytest>=8"]

[project.scripts]
hal-remote = "halremote.cli:main"

[project.gui-scripts]
hal-remote-tunnelw = "halremote.cli:tunnel_main"

[tool.uv.sources]
hal-kit = { workspace = true }

[tool.hatch.version]
path = "src/halremote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/halremote"]
