[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hal-core"
dynamic = ["version"]
description = "The hal command: agent loop host, extensions, services, eval and console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["hal-kit", "hal-hub", "hal-sandbox", "hal-gateway", "rich>=15,<16", "prompt-toolkit>=3.0.53,<4"]

[project.scripts]
hal = "halcore.cli:main"

[tool.uv.sources]
hal-kit = { workspace = true }
hal-hub = { workspace = true }
hal-sandbox = { workspace = true }
hal-gateway = { workspace = true }

[tool.hatch.version]
path = "src/halcore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/halcore"]
