# Workspace root for the Hal monorepo. It is virtual: it installs nothing itself and only
# holds the member list and the lint and test settings shared by every package.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
force-exclude = true  # pre-commit style runs that pass file names still honour excludes
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# T20 keeps print out of library code (REQ-SYS-15); RUF001 to RUF003 and PLC2401 catch
# non-ASCII text (REQ-SYS-20).
select = ["E", "F", "W", "I", "B", "UP", "T20", "RUF001", "RUF002", "RUF003", "PLC2401"]

[tool.ruff.lint.per-file-ignores]
# Entry points print by design.
"**/__main__.py" = ["T20"]
"**/cli.py" = ["T20"]
# halcore is the pre-monorepo code, moved unchanged. Each ignore goes when 06-core-cli replaces
# the module that needs it: T201 (print in library modules), E501, I001, UP035, F401.
"packages/hal-core/src/halcore/*.py" = ["T201", "E501", "I001", "UP035"]
"packages/hal-core/tests/*.py" = ["E501", "I001", "F401"]
# hal-hub's v1 modules, moved unchanged until 04-hub's plan replaces each one (step 26 removes
# the last). New hub modules get no ignores.
"packages/hal-hub/src/halhub/v1_registry.py" = ["T201", "E501", "UP037"]
"packages/hal-hub/src/halhub/v1_runner.py" = ["E501", "I001"]
"packages/hal-hub/src/halhub/mcp.py" = ["I001"]
"packages/hal-hub/src/halhub/search.py" = ["B905"]
"packages/hal-hub/src/halhub/__main__.py" = ["E501", "I001"]
"packages/hal-hub/tests/test_hub.py" = ["E501"]

[tool.ruff.format]
# Same reason: formatting the moved halcore and the v1 hub modules would bury the move in a
# rewrite of every line.
exclude = [
    "packages/hal-core/**",
    "packages/hal-hub/README.md",
    "packages/hal-hub/src/halhub/__init__.py",
    "packages/hal-hub/src/halhub/__main__.py",
    "packages/hal-hub/src/halhub/mcp.py",
    "packages/hal-hub/src/halhub/search.py",
    "packages/hal-hub/src/halhub/tools.py",
    "packages/hal-hub/src/halhub/v1_registry.py",
    "packages/hal-hub/src/halhub/v1_runner.py",
    "packages/hal-hub/tests/test_hub.py",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
markers = [
    "gpu: needs a GPU",
    "docker: needs a docker daemon",
    "network: needs the network",
    "slow: takes more than a few seconds",
    "bwrap: needs bubblewrap",
    "systemd: needs a systemd user session",
    "live: needs a real model server",
]
addopts = '--import-mode=importlib --strict-markers -m "not gpu and not docker and not network and not slow and not bwrap and not systemd and not live"'

[tool.ruff.lint.isort]
known-first-party = ["halkit", "halhub", "halagent", "halsandbox", "halgateway", "halremote", "halcore"]
