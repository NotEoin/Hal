# gitleaks configuration for CI (the "secrets" job in .github/workflows/ci.yml).
title = "Hal gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Made-up example values: the session token in the 05-gateway design spec (elided tail) and the 12-digit approval key in the TUI tests and docs"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''hal-sess-3f9a1c2e\.Zt0\.\.\.''', '''3f9a0c12d4e8''']
